<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Qalam Urdu Studio: a reed pen (qalam) writing a Nastaliq stroke. Shapes only (no text or
       filters), with everything inside the central circle so launcher masks never cut it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0b2a78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.86) translate(-287 -244)">
  <!-- Ink stroke: the sweeping bowl of a Nastaliq letter, written right to left -->
  <path d="M352 318 C 340 380, 262 410, 186 396 C 146 389, 116 368, 104 342
           C 126 356, 158 366, 194 368 C 258 372, 310 352, 330 312 Z" fill="url(#gold)"/>
  <!-- Nuqta (the diamond dot) -->
  <rect x="178" y="288" width="36" height="36" rx="5" transform="rotate(45 196 306)" fill="url(#gold)"/>
  <!-- Reed pen, its nib at the start of the stroke -->
  <g transform="translate(86 26) rotate(34 256 290) translate(0 -8)">
    <path d="M224 88 L288 88 Q298 88 298 98 L298 212 L256 294 L214 212 L214 98 Q214 88 224 88 Z" fill="url(#nib)"/>
    <path d="M214 194 L298 194 L298 212 L214 212 Z" fill="url(#gold)"/>
    <path d="M256 294 L256 238" stroke="#0b2a78" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="234" r="9" fill="#0b2a78"/>
  </g>
  </g>
</svg>
