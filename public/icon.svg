<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qalam-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2f85" />
      <stop offset="50%" stop-color="#0b57d0" />
      <stop offset="100%" stop-color="#072264" />
    </linearGradient>
    <linearGradient id="qalam-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="nib-ink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0a2463" />
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020b24" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Studio App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#qalam-bg)" />

  <!-- Decorative Gold & Ivory Calligraphic Frame -->
  <rect x="34" y="34" width="444" height="444" rx="84" fill="none" stroke="url(#qalam-gold)" stroke-width="7" opacity="0.9" />
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35" />

  <!-- Central Ivory Emblem Medallion -->
  <g transform="translate(256, 224) rotate(45)">
    <rect x="-118" y="-118" width="236" height="236" rx="34" fill="#ffffff" filter="url(#card-shadow)" />
    <rect x="-106" y="-106" width="212" height="212" rx="26" fill="none" stroke="#1d4ed8" stroke-width="4" opacity="0.22" />
  </g>

  <!-- Qalam Reed Pen Nib (Traditional Angled Cut Nib + Ink Slit + Gold Collar) -->
  <g transform="translate(256, 218)">
    <!-- Gold Pen Collar / Ring -->
    <path d="M-34 48 L34 48 L42 66 L-42 66 Z" fill="url(#qalam-gold)" />
    <!-- Main Pen Nib Body with Oblique Qalam Tip -->
    <path d="M0 -84 L48 -8 L32 48 L-32 48 L-48 -8 Z" fill="url(#nib-ink)" />
    <!-- Subtle Specular Highlight on Right Wing of Nib -->
    <path d="M0 -84 L48 -8 L32 48 L0 48 Z" fill="#ffffff" opacity="0.1" />
    <!-- Center Slit & Breather Hole -->
    <line x1="0" y1="-84" x2="0" y2="2" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="8" r="11" fill="#ffffff" />
    <circle cx="0" cy="8" r="5" fill="#f59e0b" />
    <!-- Small Urdu Calligraphy Dot / Nuqta Accent -->
    <rect x="50" y="-56" width="16" height="16" rx="3" transform="rotate(45 58 -48)" fill="url(#qalam-gold)" />
  </g>

  <!-- Urdu "قلم" Calligraphic Mark -->
  <text x="256" y="346" font-family="'Noto Nastaliq Urdu', 'Gulzar', 'Amiri', serif" font-size="60" font-weight="bold" fill="#fde047" text-anchor="middle" dominant-baseline="middle">
    قلم
  </text>

  <!-- Bottom Brand Label -->
  <text x="256" y="438" font-family="Segoe UI, Plus Jakarta Sans, Tahoma, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">
    QALAM STUDIO
  </text>
</svg>
