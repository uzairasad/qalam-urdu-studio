# Builds the downloads on GitHub's servers from this repository's source:
#   Windows  - setup.exe (NSIS), .msi, and a portable .zip
#   macOS    - .dmg for Apple Silicon and for Intel
#   Linux    - .AppImage, .deb, .rpm
#   Android  - release-signed .apk for 64-bit ARM phones (sideload); a failure here never blocks
#              a release
# Code signing uses repository secrets when they're set and is skipped when they aren't; see
# docs/SIGNING.md. The Android key is set; Windows and macOS need paid certificates.
# Releasing: push a commit to main that sets a new version in package.json. If tag vX.Y.Z doesn't
# exist yet, the plan job creates it on that commit and the release is built and published with
# SHA256SUMS.txt. (No tag push needed, so it works where tag pushes aren't allowed; pushing a
# tag vX.Y.Z yourself still works too, and whichever run comes second skips.) If a release run
# fails partway, the release stays a draft; the next push to main that touches this file or
# package.json builds and publishes it again.
# Run by hand (Actions > Release > Run workflow) it only builds and keeps the files as workflow
# artifacts; nothing is published. Tick "android_only" to build just the APK.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the Android APK (quick check, no desktop builds)
        type: boolean
        default: false

permissions:
  contents: read

# One release run at a time, so a tag push and the version bump it belongs to never both publish.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides what this run does: `build` (anything at all) and `tag` (the release to publish, or
  # empty for a build-only run). On main it creates the tag; pushed with GITHUB_TOKEN, that tag
  # doesn't start another run.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but package.json says $v"; exit 1; }
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists (made from main): nothing to do"
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
              if [ "$(gh release view "v$v" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
                # An earlier run tagged it but didn't finish publishing: build and publish again.
                echo "v$v is tagged but its release is still a draft: finishing it"
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "tag=v$v" >> "$GITHUB_OUTPUT"
              else
                echo "v$v is already tagged: no new version, nothing to release"
                echo "build=false" >> "$GITHUB_OUTPUT"
              fi
            else
              git tag "v$v" "$GITHUB_SHA"
              git push origin "v$v"
              echo "Tagged v$v on $GITHUB_SHA"
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "tag=v$v" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: plan
    if: needs.plan.outputs.build == 'true' && !inputs.android_only
    permissions:
      contents: write # uploads to the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-intel
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      # Signs only when the secrets exist (docs/SIGNING.md); otherwise builds unsigned.
      # TAURI_SIGNING_PRIVATE_KEY also turns on in-app updates: signed updater artifacts and the
      # latest.json feed the desktop apps check (tauri-action uploads it to the release).
      - name: Code signing setup
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export_vars() { for v in "$@"; do [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"; done; return 0; }
          # Extra Tauri config for this build, merged into one --config file at the end.
          echo '{}' > signing.json
          merge() { node -e "const f='signing.json',fs=require('fs'),a=JSON.parse(fs.readFileSync(f)),b=JSON.parse(process.argv[1]);
            const m=(x,y)=>{for(const k in y)x[k]=y[k]&&typeof y[k]==='object'?m(x[k]||{},y[k]):y[k];return x};fs.writeFileSync(f,JSON.stringify(m(a,b)))" "$1"; }
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Building signed updater artifacts"
            # Multi-line secrets can't go through GITHUB_ENV as KEY=value.
            { echo "TAURI_SIGNING_PRIVATE_KEY<<KEY_EOF"; echo "$TAURI_SIGNING_PRIVATE_KEY"; echo "KEY_EOF"; } >> "$GITHUB_ENV"
            export_vars TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            merge '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: no in-app update feed for this build"
          fi
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Signing (and notarizing, if APPLE_ID is set) the macOS app"
            export_vars APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          elif [ "$RUNNER_OS" = Windows ] && [ -n "$AZURE_CLIENT_ID" ]; then
            echo "Signing the Windows app with Azure Trusted Signing"
            cargo install trusted-signing-cli --locked
            export_vars AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID
            merge "$(node -e "console.log(JSON.stringify({bundle:{windows:{signCommand:
              'trusted-signing-cli -e ' + process.env.AZURE_SIGNING_ENDPOINT + ' -a ' + process.env.AZURE_SIGNING_ACCOUNT +
              ' -c ' + process.env.AZURE_CERT_PROFILE + ' -d \"Qalam Urdu Studio\" %1'}}}))")"
          else
            echo "No signing secrets for $RUNNER_OS: building unsigned"
          fi
          echo "args=--config signing.json" >> "$GITHUB_OUTPUT"

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} ${{ steps.signing.outputs.args }}
          # On a tag: attach to a draft release that the publish job finalises.
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: Qalam Urdu Studio ${{ needs.plan.outputs.tag }}
          releaseBody: See CHANGELOG.md. Verify downloads against SHA256SUMS.txt.
          releaseDraft: true
          prerelease: false
          # The updater feed (latest.json) is written once by the publish job: four builds
          # updating it at the same time clash. Failed uploads are retried.
          includeUpdaterJson: false
          retryAttempts: 3

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $dir = "Qalam-Urdu-Studio-$v-portable"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/qalam-urdu-studio.exe" "$dir/Qalam Urdu Studio.exe"
          "Portable Qalam Urdu Studio. Needs Microsoft Edge WebView2 (built into Windows 10/11)." | Out-File "$dir/README.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "$dir-windows-x64.zip"

      - name: Attach portable zip
        if: runner.os == 'Windows' && needs.plan.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.plan.outputs.tag }}" (Get-ChildItem *-portable-windows-x64.zip).FullName --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: qalam-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            *-portable-windows-x64.zip
          if-no-files-found: ignore
          retention-days: 14

  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    continue-on-error: true
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The ubuntu runner ships the Android SDK (ANDROID_HOME); only the NDK is added.
      - name: NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      - name: Generate the Android project
        run: |
          npx tauri android init --ci
          npx tauri icon public/icon.svg
      # 64-bit ARM only (virtually every phone since 2017). Release build signed with the
      # project's key (docs/SIGNING.md), so later versions install as updates. Without the key
      # (a fork, say) it falls back to a lean debug-signed build.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Not a secret (it would mask the word everywhere in the logs).
          ANDROID_KEY_ALIAS: qalam
        run: |
          v=$(node -p "require('./package.json').version")
          out="Qalam-Urdu-Studio-$v-android-arm64.apk"
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK"
            export CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_DEV_STRIP=symbols CARGO_PROFILE_DEV_OPT_LEVEL=s
            npx tauri android build --apk --debug --target aarch64 --ci
            cp "$(find src-tauri/gen/android -name '*-debug.apk' | head -n1)" "$out"
          else
            npx tauri android build --apk --target aarch64 --ci
            apk=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n1)
            bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            "$bt/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --out "$out" "$RUNNER_TEMP/aligned.apk"
            rm -f "$RUNNER_TEMP/release.p12"
            "$bt/apksigner" verify --print-certs "$out"
          fi
          ls -l "$out"
      - name: Attach APK
        if: needs.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" Qalam-Urdu-Studio-*-android-arm64.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: qalam-android
          path: Qalam-Urdu-Studio-*-android-arm64.apk
          retention-days: 14

  publish:
    # Waits for the desktop builds; Android is best-effort (attached if it finished in time).
    needs: [plan, desktop, android]
    if: always() && needs.plan.outputs.tag != '' && needs.desktop.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: SHA256SUMS.txt and the updater feed
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern '*' --skip-existing
          rm -f latest.json SHA256SUMS.txt
          # latest.json: what installed desktop apps check for updates, from the signed bundles.
          node - <<'JS'
          const fs = require('fs');
          const tag = process.env.TAG;
          const base = `https://github.com/${process.env.GH_REPO}/releases/download/${tag}/`;
          const files = fs.readdirSync('.');
          const entry = (re) => {
            const f = files.find((n) => re.test(n) && files.includes(`${n}.sig`));
            return f && { signature: fs.readFileSync(`${f}.sig`, 'utf8').trim(), url: base + encodeURIComponent(f) };
          };
          const p = {};
          const add = (keys, e) => { if (e) for (const k of keys) p[k] = e; };
          add(['darwin-aarch64', 'darwin-aarch64-app'], entry(/_aarch64\.app\.tar\.gz$/));
          add(['darwin-x86_64', 'darwin-x86_64-app'], entry(/_x64\.app\.tar\.gz$/));
          add(['windows-x86_64', 'windows-x86_64-msi'], entry(/\.msi$/));
          add(['windows-x86_64-nsis'], entry(/-setup\.exe$/));
          add(['linux-x86_64', 'linux-x86_64-appimage'], entry(/\.AppImage$/));
          add(['linux-x86_64-deb'], entry(/\.deb$/));
          add(['linux-x86_64-rpm'], entry(/\.rpm$/));
          if (!Object.keys(p).length) { console.log('No signed bundles: no updater feed'); process.exit(0); }
          const feed = { version: tag.replace(/^v/, ''), notes: 'See CHANGELOG.md. Verify downloads against SHA256SUMS.txt.', pub_date: new Date().toISOString(), platforms: p };
          fs.writeFileSync('latest.json', JSON.stringify(feed, null, 2));
          console.log(Object.keys(p).join(' '));
          JS
          [ -f latest.json ] && gh release upload "$TAG" latest.json --clobber
          rm -f *.sig
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest
