[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.80"
authors = ["Uzair Asad"]
publish = false
license = "GPL-3.0-or-later"
homepage = "https://uzairasad.github.io/qalam-urdu-studio/"
repository = "https://github.com/uzairasad/qalam-urdu-studio"

[profile.dev]
# Local debug builds: line numbers for our own crate (enough for panics and backtraces), no
# debug info for the ~500 dependencies. Full debug info made target/ grow past 16 GB.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
# Small, fast desktop binaries.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
